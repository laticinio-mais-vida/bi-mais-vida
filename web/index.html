<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel Mais Vida</title>
<link rel="icon" href="/img/logo-maisvida.png">
<script>
  // Aplica o tema antes de desenhar a página, para não piscar.
  (function () {
    var t = null;
    try { t = localStorage.getItem("mv-tema"); } catch (e) {}
    if (!t) t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet" crossorigin="anonymous">
<link rel="stylesheet" href="/css/app.css">
</head>
<body class="com-lateral">
<aside class="lateral" id="lateral" aria-label="Páginas do painel">
  <div class="lateral-topo">
    <button class="lateral-alternar" id="btn-lateral" type="button" aria-controls="lateral" aria-expanded="false" aria-label="Expandir o menu">
      <span data-icone="painel"></span>
    </button>
    <span class="lateral-titulo">Painel Mais Vida</span>
  </div>
  <nav class="lateral-nav">
    <span class="lateral-secao"><span>Páginas</span></span>
    <a href="#/metas" class="lateral-item" data-rota="metas" data-pagina="metas" hidden><span data-icone="alvo"></span><span class="rotulo">Metas</span></a>
    <a href="#/projecoes" class="lateral-item" data-rota="projecoes" data-pagina="projecoes" hidden><span data-icone="tendencia"></span><span class="rotulo">Projeções</span></a>
    <a href="#/assistente" class="lateral-item" data-rota="assistente" data-pagina="assistente" hidden><span data-icone="conversa"></span><span class="rotulo">Assistente</span></a>
    <a href="#/gestao" class="lateral-item" data-rota="gestao" data-pagina="gestao" hidden><span data-icone="quadro"></span><span class="rotulo">Gestão</span></a>
    <a href="#/credito" class="lateral-item" data-rota="credito" data-pagina="credito" hidden><span data-icone="cartao"></span><span class="rotulo">Crédito</span></a>
    <a href="#/agenda" class="lateral-item" data-rota="agenda" data-pagina="agenda" hidden><span data-icone="calendario"></span><span class="rotulo">Agenda</span></a>
    <div class="lateral-grupo" data-admin hidden>
      <span class="lateral-secao"><span>Administração</span></span>
      <a href="#/usuarios" class="lateral-item" data-rota="usuarios"><span data-icone="escudo"></span><span class="rotulo">Usuários</span></a>
    </div>
  </nav>
</aside>
<div class="lateral-fundo" id="lateral-fundo" hidden></div>

<header class="hero" id="hero">
  <svg class="hero-cena" viewBox="0 0 1440 300" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <defs>
      <linearGradient id="g-ceu" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" class="ceu-1"/>
        <stop offset=".62" class="ceu-2"/>
        <stop offset="1" class="ceu-3"/>
      </linearGradient>
      <radialGradient id="g-astro" cx=".5" cy=".5" r=".5">
        <stop offset="0" class="astro-1"/>
        <stop offset="1" class="astro-2"/>
      </radialGradient>
      <linearGradient id="g-colina-1" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" class="colina-1a"/>
        <stop offset="1" class="colina-1b"/>
      </linearGradient>
      <linearGradient id="g-colina-2" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" class="colina-2a"/>
        <stop offset="1" class="colina-2b"/>
      </linearGradient>
    </defs>
    <rect width="1440" height="300" fill="url(#g-ceu)"/>
    <g class="estrelas">
      <circle cx="140" cy="40" r="1.6"/><circle cx="260" cy="88" r="1.1"/><circle cx="420" cy="30" r="1.4"/>
      <circle cx="560" cy="70" r="1"/><circle cx="700" cy="24" r="1.5"/><circle cx="820" cy="96" r="1.2"/>
      <circle cx="930" cy="44" r="1"/><circle cx="1040" cy="78" r="1.6"/><circle cx="1180" cy="30" r="1.1"/>
      <circle cx="1320" cy="64" r="1.3"/><circle cx="1390" cy="22" r="1"/><circle cx="60" cy="110" r="1.2"/>
      <circle cx="340" cy="130" r="1"/><circle cx="640" cy="120" r="1.1"/><circle cx="1110" cy="124" r="1"/>
    </g>
    <g class="astro">
      <circle cx="1330" cy="176" r="78" fill="url(#g-astro)" class="astro-brilho"/>
      <circle cx="1330" cy="176" r="32" class="astro-disco"/>
      <circle cx="1344" cy="167" r="29" class="lua-sombra"/>
    </g>
    <g class="nuvens">
      <g class="nuvem n1"><ellipse cx="0" cy="0" rx="58" ry="17"/><ellipse cx="-22" cy="-12" rx="28" ry="18"/><ellipse cx="18" cy="-15" rx="32" ry="21"/></g>
      <g class="nuvem n2"><ellipse cx="0" cy="0" rx="44" ry="13"/><ellipse cx="-14" cy="-9" rx="22" ry="14"/><ellipse cx="14" cy="-11" rx="24" ry="16"/></g>
      <g class="nuvem n3"><ellipse cx="0" cy="0" rx="70" ry="19"/><ellipse cx="-28" cy="-14" rx="32" ry="20"/><ellipse cx="22" cy="-18" rx="38" ry="24"/></g>
    </g>
    <path class="colina colina-fundo" fill="url(#g-colina-1)" d="M0 230 C 180 170, 360 168, 560 205 S 900 250, 1080 200 S 1320 150, 1440 175 L1440 300 L0 300 Z"/>
    <path class="colina colina-frente" fill="url(#g-colina-2)" d="M0 262 C 220 236, 420 222, 640 246 S 1000 282, 1200 240 S 1380 222, 1440 230 L1440 300 L0 300 Z"/>
    <rect class="faixa" x="0" y="290" width="1440" height="10"/>
  </svg>

  <div class="hero-conteudo">
    <button class="btn-vidro btn-menu" id="btn-menu" type="button" aria-controls="lateral" aria-expanded="false" aria-label="Abrir o menu de páginas">
      <span data-icone="menu"></span>
    </button>
    <a class="marca" href="#/" aria-label="Início">
      <img src="/img/logo-maisvida.png" alt="Mais Vida" width="176" height="67">
    </a>
    <div class="hero-titulo">
      <h1 id="titulo-pagina">Acompanhamento de Metas</h1>
      <p id="subtitulo-pagina" class="hero-sub">Carregando…</p>
    </div>
    <div class="hero-acoes">
      <button class="btn-vidro" id="btn-atualizar" type="button" title="Ler de novo a cópia do banco" data-admin data-so-local hidden>
        <span data-icone="atualizar"></span><span class="rotulo">Atualizar dados</span>
      </button>
      <button class="btn-vidro btn-usuario" id="btn-usuario" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="menu-usuario">
        <span class="avatar" id="avatar-usuario"></span><span class="rotulo" id="nome-usuario"></span>
      </button>
      <button class="tema-alternar" id="btn-tema" type="button" aria-label="Alternar tema claro e escuro">
        <span class="tema-trilho"><span class="tema-bola"><span data-icone="sol" class="ic-sol"></span><span data-icone="lua" class="ic-lua"></span></span></span>
      </button>
    </div>
  </div>
</header>

<main id="app" class="app" tabindex="-1">
  <section id="pagina-metas" class="pagina" hidden></section>
  <section id="pagina-projecoes" class="pagina" hidden></section>
  <section id="pagina-configuracoes" class="pagina" hidden></section>
  <section id="pagina-config-projecoes" class="pagina" hidden></section>
  <section id="pagina-assistente" class="pagina" hidden></section>
  <section id="pagina-config-assistente" class="pagina" hidden></section>
  <section id="pagina-gestao" class="pagina" hidden></section>
  <section id="pagina-config-gestao" class="pagina" hidden></section>
  <section id="pagina-credito" class="pagina" hidden></section>
  <section id="pagina-agenda" class="pagina" hidden></section>
  <section id="pagina-usuarios" class="pagina" hidden></section>
</main>

<footer class="rodape" id="rodape"></footer>

<div class="menu-usuario" id="menu-usuario" role="menu" hidden>
  <div class="menu-cab"><span class="avatar grande" id="menu-avatar"></span><div><b id="menu-nome"></b><small id="menu-papel"></small></div></div>
  <button type="button" role="menuitem" id="btn-trocar-senha"><span data-icone="chave"></span>Trocar minha senha</button>
  <button type="button" role="menuitem" id="btn-sair"><span data-icone="sair"></span>Sair</button>
</div>

<dialog class="dialogo" id="dlg-senha" aria-labelledby="dlg-senha-titulo">
  <form method="dialog" id="form-senha" novalidate>
    <h2 id="dlg-senha-titulo"><span data-icone="chave"></span>Trocar minha senha</h2>
    <p class="sub">Os outros aparelhos em que você estiver conectado vão pedir a senha nova.</p>
    <label class="campo-form"><span>Senha atual</span><input type="password" name="atual" autocomplete="current-password" required></label>
    <label class="campo-form"><span>Nova senha (mínimo 6 caracteres)</span><input type="password" name="nova" autocomplete="new-password" required></label>
    <label class="campo-form"><span>Repita a nova senha</span><input type="password" name="nova2" autocomplete="new-password" required></label>
    <p class="form-erro" role="alert" hidden></p>
    <div class="dialogo-acoes">
      <button class="btn" type="button" value="cancelar" id="dlg-senha-cancelar">Cancelar</button>
      <button class="btn primario" type="submit">Salvar senha</button>
    </div>
  </form>
</dialog>

<div class="tooltip" id="tooltip" role="tooltip" hidden></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="tela-preparo" id="tela-preparo" hidden>
  <div class="preparo-cartao">
    <div class="preparo-vaca"><img src="/img/logo-maisvida.png" alt=""></div>
    <h2>Preparando os dados</h2>
    <p id="preparo-etapa">Lendo a cópia do banco…</p>
    <div class="preparo-barra"><span></span></div>
  </div>
</div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
