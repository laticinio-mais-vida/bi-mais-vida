; Copie este arquivo para config.ini e preencha a senha do banco.
; O config.ini fica fora do repositório (está no .gitignore) porque guarda a senha.
; As regras de negócio (produtos, vendedores, devoluções, feriados) ficam na página Configurações do painel.

[banco]
; Cópia do banco do ERP (Firebird 2.1). O sistema só lê, numa transação somente leitura.
arquivo = C:\Users\Micro\Documents\banco de dados\LATICINIOMAISVIDALTDA.GDB
host = localhost
usuario = SYSDBA
senha = COLOQUE_A_SENHA_AQUI
fbclient = C:\Program Files\Firebird\Firebird_2_1\bin\fbclient.dll
codificacao = cp1252

[planilhas]
metas = C:\Users\Micro\Documents\METAS.xlsx
metas_produtos = C:\Users\Micro\Documents\METAS PRODUTOS.xlsx

[cache]
; Primeiro dia trazido do banco para o cache local.
inicio = 2024-01-01
arquivo = dados\cache.duckdb

[servidor]
porta = 8050
; 127.0.0.1 = só este computador abre o painel.
; 0.0.0.0   = outros computadores da rede também abrem (cada pessoa entra com o próprio usuário e senha).
endereco = 127.0.0.1

[publicacao]
; Painel na internet (VPS). Veja docs/publicacao_vps.md.
; modo = local -> este computador lê a cópia do banco (padrão).
; modo = vps   -> não lê o banco: recebe o cache e as planilhas do computador da empresa.
modo = local
; Só no computador da empresa: endereço do painel no VPS. Em branco, nada é enviado.
enviar_para =
; A mesma chave no PC e no VPS. Gere com: python app.py --gerar-chave
chave =

[ia]
; Página Assistente: perguntas sobre os dados respondidas pelo Claude (API da Anthropic). Veja o README.
; A chave é cobrada por uso e é separada da assinatura do Claude: crie em platform.claude.com (API keys) e
; coloque SÓ no config.ini. Em branco, a página mostra "não configurado". Precisa do pacote: pip install anthropic
chave =
; claude-opus-5-5 (padrão, o mais capaz) ou claude-sonnet-5-5 (cerca de metade do custo).
modelo = claude-opus-5-5
; Quanto o modelo pensa antes de responder: low (mais rápido e barato), medium, high.
esforco = medium
max_tokens = 16000
; Consultas que a IA pode fazer por pergunta; tempo máximo da pergunta e de cada consulta (segundos).
max_passos = 8
tempo_total = 100
tempo_sql = 10
timeout = 60
max_linhas = 200
; Perguntas por pessoa por dia (administradores não têm limite) e gasto máximo do dia em US$ (todos).
limite_diario = 50
limite_custo_dia = 2.00
; Perguntas respondidas ao mesmo tempo e quantos acessos diferentes ficam com os dados prontos na memória.
simultaneos = 2
recortes = 2
; Preço em US$ por milhão de tokens (Opus 5.5; para o Sonnet 5.5: 2, 10, 0.20 e 2.50), só para o registro de custo.
preco_entrada = 4
preco_saida = 20
preco_cache_leitura = 0.20
preco_cache_escrita = 5
